name: career-journey
services:
  app:
    build:
      context: .
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        APP_VERSION: ${APP_VERSION:-local}
    image: career-journey:${APP_VERSION:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: ${APP_URL:-https://career-journey.oso.group}
      NODE_ENV: production
      PORT: "47293"
      DATA_DIR: /app/data
      CHROME_PATH: /usr/bin/chromium
      CHROME_NO_SANDBOX: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-47293}:47293"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/app/data
      - prompt-config:/app/server/promptConfig
      - knowledge-config:/app/server/knowledgeConfig
    shm_size: "256mb"
volumes:
  app-data:
  prompt-config:
  knowledge-config:
