# Usage (on the VM, from the repo root, with a filled-in .env):
#   APP_VERSION=$(git rev-parse --short HEAD) docker compose up -d --build
#
# The same .env serves two purposes: Compose interpolates the public VITE_* build
# args from it, and `env_file` hands every variable to the server at runtime.
services:
  app:
    build:
      context: .
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        APP_VERSION: ${APP_VERSION:-}
    image: career-journey:latest
    container_name: career-journey
    restart: unless-stopped
    env_file: .env
    environment:
      # The image's Chromium; overrides any host path left in .env.
      CHROME_PATH: /usr/bin/chromium
    ports:
      # The server always listens on 47293 inside the container; HOST_PORT picks the VM side.
      - "${HOST_PORT:-47293}:47293"
    extra_hosts:
      # Lets OLLAMA_BASE_URL=http://host.docker.internal:11434 reach an Ollama on the VM itself.
      - "host.docker.internal:host-gateway"
    volumes:
      # Admin edits to prompts and AI skills persist across rebuilds.
      - prompt-config:/app/server/promptConfig
      - knowledge-config:/app/server/knowledgeConfig
    # Chromium uses /dev/shm for rendering; Docker's 64MB default is too small.
    shm_size: "256mb"

volumes:
  prompt-config:
  knowledge-config:
